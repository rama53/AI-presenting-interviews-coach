name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Build static site
        env:
          NEXT_PUBLIC_TALEEQ_API_URL: https://taleeq-api.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: https://lkctvdovnfnmoxedmqyf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          corepack pnpm build
          corepack pnpm exec tsc --noEmit
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
